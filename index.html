<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12201a">
<title>오션짐 업무 체크리스트</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무리스트">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">OCEAN GYM</div>
  </header>
  <div class="date-line" id="dateLine"></div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">불러오는 중...</div>
  </div>

  <div id="timeline" class="timeline"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="big">등록된 업무가 없어요</div>
    <div>관리자가 업무를 등록하면 여기 표시돼요</div>
  </div>
  <div class="version-footer" id="versionFooter"></div>
</div>

<a href="admin.html" class="admin-link">관리자</a>
<button class="now-jump-btn" id="nowJumpBtn" style="display:none">지금 시간대로</button>
<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirmOverlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-buttons">
      <button class="btn ghost" id="confirmNo">아니요</button>
      <button class="btn" id="confirmYes">네</button>
    </div>
  </div>
</div>

<script>
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#14201a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// KST(UTC+9) 시각을 구하는 공통 헬퍼.
// Date.now()는 기기 시간대와 무관하게 항상 절대적인 UTC epoch이므로,
// 여기에 9시간만 더하면 되는데, 예전 코드는 기기의 getTimezoneOffset()까지
// 추가로 반영해서 한국 시간대 기기에서는 오후 3시 이후부터 날짜가 하루 앞서 계산되는 버그가 있었음.
function nowInKST() {
  return new Date(Date.now() + 9 * 60 * 60000);
}

function todayKST() {
  return nowInKST().toISOString().slice(0, 10);
}

function nowTimeKST() {
  const kst = nowInKST();
  return `${String(kst.getUTCHours()).padStart(2,'0')}:${String(kst.getUTCMinutes()).padStart(2,'0')}`;
}

// 현재 시각 기준으로 "지금 해당하는" 시간대의 index를 찾음
// (현재 시각 이하인 시간대 중 가장 늦은 것 = 지금 진행 중인 시간대, 아직 첫 시간대 전이면 0번)
function findCurrentSlotIndex(slotList) {
  if (!slotList.length) return -1;
  const now = nowTimeKST();
  let idx = 0;
  for (let i = 0; i < slotList.length; i++) {
    if (slotList[i].time <= now) idx = i;
    else break;
  }
  return idx;
}

function formatDateLine() {
  const kst = nowInKST();
  const days = ['일','월','화','수','목','금','토'];
  return `${kst.getUTCFullYear()}.${String(kst.getUTCMonth()+1).padStart(2,'0')}.${String(kst.getUTCDate()).padStart(2,'0')} (${days[kst.getUTCDay()]})`;
}

let tasks = [];
let checks = {};
const dateKey = todayKST();

// 방금 내가 직접 체크/해제한 항목은, 서버(Netlify Blobs)에 실제로 반영되기까지
// 약간의 지연(eventual consistency)이 있을 수 있어서, 그 사이의 자동 새로고침이
// 아직 반영 안 된 서버 값으로 화면을 덮어써버리는 걸 막기 위한 임시 우선순위 저장소.
// 항목별로 일정 시간(PENDING_TTL) 동안만 유지되고, 그 뒤엔 서버 값을 그대로 신뢰함.
const pendingChecks = {}; // taskId -> { value: boolean, expiresAt: number }
const PENDING_TTL = 30000;

document.getElementById('dateLine').textContent = formatDateLine();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function render() {
  const timeline = document.getElementById('timeline');
  const emptyState = document.getElementById('emptyState');

  if (!tasks.length) {
    timeline.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('progressLabel').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }
  timeline.style.display = 'block';
  emptyState.style.display = 'none';

  const currentIdx = findCurrentSlotIndex(tasks);

  let total = 0, done = 0;
  timeline.innerHTML = tasks.map((slot, i) => {
    const slotDone = slot.tasks.every(t => checks[t.id]);
    total += slot.tasks.length;
    done += slot.tasks.filter(t => checks[t.id]).length;
    const isNow = i === currentIdx;
    return `
      <div class="slot ${slot.tasks.length && slotDone ? 'done' : ''} ${isNow ? 'is-now' : ''}" ${isNow ? 'data-current="1"' : ''}>
        <div class="slot-time">${slot.time}${isNow ? '<span class="now-badge">지금</span>' : ''}</div>
        <div class="slot-card">
          ${slot.tasks.map(t => `
            <div class="task-row ${checks[t.id] ? 'checked' : ''}" data-id="${t.id}">
              <div class="checkbox">${CHECK_ICON}</div>
              <div class="task-text">${escapeHtml(t.text)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('progressFill').style.width = total ? `${(done/total)*100}%` : '0%';
  document.getElementById('progressLabel').textContent = total ? `${done} / ${total}개 완료` : '';

  document.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => handleTaskClick(row.dataset.id));
  });

  updateNowJumpButtonVisibility();
}

// 체크할 땐 바로 반영하고, 이미 체크된 걸 해제하려는 경우에만 확인창을 거침
function handleTaskClick(taskId) {
  if (checks[taskId]) {
    showUncheckConfirm(taskId);
  } else {
    toggleCheck(taskId);
  }
}

function findTaskById(taskId) {
  for (const slot of tasks) {
    const found = slot.tasks.find(t => t.id === taskId);
    if (found) return found;
  }
  return null;
}

function showUncheckConfirm(taskId) {
  const task = findTaskById(taskId);
  const label = task ? task.text : '이 업무';
  document.getElementById('confirmText').textContent = `'${label}' 체크를 해제할까요?`;

  const overlay = document.getElementById('confirmOverlay');
  const yesBtn = document.getElementById('confirmYes');
  const noBtn = document.getElementById('confirmNo');
  overlay.style.display = 'flex';

  function cleanup() {
    overlay.style.display = 'none';
    yesBtn.removeEventListener('click', onYes);
    noBtn.removeEventListener('click', onNo);
  }
  function onYes() {
    cleanup();
    toggleCheck(taskId);
  }
  function onNo() {
    cleanup();
  }
  yesBtn.addEventListener('click', onYes);
  noBtn.addEventListener('click', onNo);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function toggleCheck(taskId) {
  const next = !checks[taskId];
  checks[taskId] = next;
  pendingChecks[taskId] = { value: next, expiresAt: Date.now() + PENDING_TTL };
  render();
  try {
    await fetch('/.netlify/functions/checks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateKey, taskId, checked: next })
    });
  } catch (e) {
    delete pendingChecks[taskId];
    showToast('저장 실패, 다시 시도해주세요');
    checks[taskId] = !next;
    render();
  }
}

async function loadTasks() {
  try {
    const res = await fetch('/.netlify/functions/tasks');
    const data = await res.json();
    // 서버에 저장된 순서가 시간순이 아닐 수도 있으므로(예: 관리자가 시간대 복제 후 시간만 바꾼 경우),
    // "지금 시간대" 계산과 화면 표시 모두를 위해 항상 시간순으로 다시 정렬해서 사용함
    tasks = (data.tasks || []).slice().sort((a, b) => a.time.localeCompare(b.time));
  } catch (e) {
    tasks = [];
  }
}

async function loadChecks() {
  try {
    const res = await fetch(`/.netlify/functions/checks?date=${dateKey}`);
    const data = await res.json();
    const serverChecks = data.checks || {};

    // 만료된 pending 항목은 정리 (이 시점부턴 서버 값을 그대로 신뢰함)
    const now = Date.now();
    Object.keys(pendingChecks).forEach(id => {
      if (pendingChecks[id].expiresAt <= now) delete pendingChecks[id];
    });

    // 서버 값 위에, 아직 유효한 pending(내가 방금 누른 값)을 덧씌워서 병합
    const merged = { ...serverChecks };
    Object.keys(pendingChecks).forEach(id => {
      if (pendingChecks[id].value) {
        merged[id] = true;
      } else {
        delete merged[id];
      }
    });

    checks = merged;
  } catch (e) {
    // 네트워크 실패 시엔 기존 화면 상태를 그대로 유지 (checks를 비우지 않음)
  }
}

function scrollToCurrentSlot() {
  const el = document.querySelector('.slot.is-now');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

document.getElementById('nowJumpBtn').addEventListener('click', scrollToCurrentSlot);

// 업무가 하나라도 있으면 항상 이동 버튼 노출 (업무 개수가 많으면 시간대가 적어도 스크롤이 길어질 수 있음)
function updateNowJumpButtonVisibility() {
  const btn = document.getElementById('nowJumpBtn');
  btn.style.display = tasks.length > 0 ? 'block' : 'none';
}

async function init() {
  await Promise.all([loadTasks(), loadChecks()]);
  render();
  // 페이지를 처음 열었을 때만 현재 시간대로 스크롤 이동
  // (레이아웃이 완전히 잡힌 뒤 이동하도록 살짝 지연)
  setTimeout(scrollToCurrentSlot, 80);
}

init();

// 다른 직원의 체크 상황 + 관리자가 새로 추가/수정한 업무 목록을 함께 반영하기 위한 주기적 새로고침.
// 화면이 안 보이는 동안(다른 앱으로 전환 등)엔 아무도 안 보고 있으니 폴링을 멈춰서
// 불필요한 서버 호출을 줄이고, 다시 화면으로 돌아오면 즉시 한 번 새로고침한 뒤 폴링을 재개함.
let pollTimer = null;

async function refreshOnce() {
  await Promise.all([loadTasks(), loadChecks()]);
  render();
}

function startPolling() {
  if (pollTimer) return; // 이미 돌고 있으면 중복 시작 안 함
  pollTimer = setInterval(refreshOnce, 15000);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling();
  } else {
    refreshOnce();
    startPolling();
  }
});

if (!document.hidden) {
  startPolling();
}

// 배포가 실제로 제대로 됐는지 화면에서 바로 확인할 수 있도록 하단에 버전(배포 날짜) 표시
async function loadVersion() {
  try {
    const res = await fetch(`version.json?t=${Date.now()}`);
    const data = await res.json();
    const match = /^(\d{4})\.(\d{2})\.(\d{2})(-\d+)?$/.exec(data.version || '');
    const el = document.getElementById('versionFooter');
    if (match) {
      const [, y, m, d, suffix] = match;
      el.textContent = `v${y}.${Number(m)}.${Number(d)}${suffix || ''}`;
    } else if (data.version) {
      el.textContent = `v${data.version}`;
    }
  } catch (e) {
    // 실패해도 화면 기능엔 영향 없으므로 조용히 무시
  }
}
loadVersion();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
</body>
</html>
