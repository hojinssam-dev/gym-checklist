<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12201a">
<title>오션짐 업무 체크리스트</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">오션짐</div>
  </header>
  <div class="date-line" id="dateLine"></div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">불러오는 중...</div>
  </div>

  <div id="timeline" class="timeline"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="big">등록된 업무가 없어요</div>
    <div>관리자가 업무를 등록하면 여기 표시돼요</div>
  </div>
</div>

<a href="admin.html" class="admin-link">관리자</a>
<button class="now-jump-btn" id="nowJumpBtn" style="display:none">지금 시간대로</button>
<div class="toast" id="toast"></div>

<script>
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#14201a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function todayKST() {
  const now = new Date();
  const kst = new Date(now.getTime() + (9 * 60 - now.getTimezoneOffset()) * 60000);
  return kst.toISOString().slice(0, 10);
}

function nowTimeKST() {
  const now = new Date();
  const kst = new Date(now.getTime() + (9 * 60 - now.getTimezoneOffset()) * 60000);
  return `${String(kst.getUTCHours()).padStart(2,'0')}:${String(kst.getUTCMinutes()).padStart(2,'0')}`;
}

// 현재 시각 기준으로 "지금 해당하는" 시간대의 index를 찾음
// (현재 시각 이하인 시간대 중 가장 늦은 것 = 지금 진행 중인 시간대, 아직 첫 시간대 전이면 0번)
function findCurrentSlotIndex(slotList) {
  if (!slotList.length) return -1;
  const now = nowTimeKST();
  let idx = 0;
  for (let i = 0; i < slotList.length; i++) {
    if (slotList[i].time <= now) idx = i;
    else break;
  }
  return idx;
}

function formatDateLine() {
  const now = new Date();
  const kst = new Date(now.getTime() + (9 * 60 - now.getTimezoneOffset()) * 60000);
  const days = ['일','월','화','수','목','금','토'];
  return `${kst.getUTCFullYear()}.${String(kst.getUTCMonth()+1).padStart(2,'0')}.${String(kst.getUTCDate()).padStart(2,'0')} (${days[kst.getUTCDay()]})`;
}

let tasks = [];
let checks = {};
const dateKey = todayKST();

document.getElementById('dateLine').textContent = formatDateLine();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function render() {
  const timeline = document.getElementById('timeline');
  const emptyState = document.getElementById('emptyState');

  if (!tasks.length) {
    timeline.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('progressLabel').textContent = '';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }
  timeline.style.display = 'block';
  emptyState.style.display = 'none';

  const currentIdx = findCurrentSlotIndex(tasks);

  let total = 0, done = 0;
  timeline.innerHTML = tasks.map((slot, i) => {
    const slotDone = slot.tasks.every(t => checks[t.id]);
    total += slot.tasks.length;
    done += slot.tasks.filter(t => checks[t.id]).length;
    const isNow = i === currentIdx;
    return `
      <div class="slot ${slot.tasks.length && slotDone ? 'done' : ''} ${isNow ? 'is-now' : ''}" ${isNow ? 'data-current="1"' : ''}>
        <div class="slot-time">${slot.time}${isNow ? '<span class="now-badge">지금</span>' : ''}</div>
        <div class="slot-card">
          ${slot.tasks.map(t => `
            <div class="task-row ${checks[t.id] ? 'checked' : ''}" data-id="${t.id}">
              <div class="checkbox">${CHECK_ICON}</div>
              <div class="task-text">${escapeHtml(t.text)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('progressFill').style.width = total ? `${(done/total)*100}%` : '0%';
  document.getElementById('progressLabel').textContent = total ? `${done} / ${total}개 완료` : '';

  document.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => toggleCheck(row.dataset.id));
  });

  updateNowJumpButtonVisibility();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function toggleCheck(taskId) {
  const next = !checks[taskId];
  checks[taskId] = next;
  render();
  try {
    await fetch('/.netlify/functions/checks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateKey, taskId, checked: next })
    });
  } catch (e) {
    showToast('저장 실패, 다시 시도해주세요');
    checks[taskId] = !next;
    render();
  }
}

async function loadTasks() {
  try {
    const res = await fetch('/.netlify/functions/tasks');
    const data = await res.json();
    tasks = data.tasks || [];
  } catch (e) {
    tasks = [];
  }
}

async function loadChecks() {
  try {
    const res = await fetch(`/.netlify/functions/checks?date=${dateKey}`);
    const data = await res.json();
    checks = data.checks || {};
  } catch (e) {
    checks = {};
  }
}

function scrollToCurrentSlot() {
  const el = document.querySelector('.slot.is-now');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

document.getElementById('nowJumpBtn').addEventListener('click', scrollToCurrentSlot);

// 업무가 하나라도 있으면 항상 이동 버튼 노출 (업무 개수가 많으면 시간대가 적어도 스크롤이 길어질 수 있음)
function updateNowJumpButtonVisibility() {
  const btn = document.getElementById('nowJumpBtn');
  btn.style.display = tasks.length > 0 ? 'block' : 'none';
}

async function init() {
  await Promise.all([loadTasks(), loadChecks()]);
  render();
  // 페이지를 처음 열었을 때만 현재 시간대로 스크롤 이동
  // (레이아웃이 완전히 잡힌 뒤 이동하도록 살짝 지연)
  setTimeout(scrollToCurrentSlot, 80);
}

init();

// 다른 직원의 체크 상황을 반영하기 위한 주기적 새로고침
setInterval(async () => {
  await loadChecks();
  render();
}, 15000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
</body>
</html>
